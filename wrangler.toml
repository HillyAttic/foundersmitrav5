name = "foundersmitra"
compatibility_date = "2024-01-01"

# Pages configuration
# This is the deploy root. It must stay "dist" and not ".": Pages uploads
# everything in it, so pointing at the repo root published package.json,
# the setup docs and infra config. build.mjs stages the site into dist/.
# Do not point this at "." again.
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare dashboard)
[env.production]
vars = { ENVIRONMENT = "production" }

[env.preview]
vars = { ENVIRONMENT = "preview" }
